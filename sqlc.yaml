version: "2"
overrides:
  go:
    rename:
      liquidacione: Liquidacion
      liquidacion_unidade: LiquidacionUnidad
sql:
  - engine: "postgresql"
    schema: "db/migrations"
    queries: "db/queries"
    gen:
      go:
        package: "db"
        out: "internal/database/gen"
        sql_package: "pgx/v5"
        emit_json_tags: true
        emit_empty_slices: true
