name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: consorcio
          POSTGRES_PASSWORD: consorcio
          POSTGRES_DB: consorcioabierto
        ports:
          - "5432:5432"
        options: >-
          --health-cmd "pg_isready -U consorcio -d consorcioabierto"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://consorcio:consorcio@localhost:5432/consorcioabierto?sslmode=disable
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
      - uses: sqlc-dev/setup-sqlc@v4
        with:
          version: v1.31.1
      - uses: golangci/golangci-lint-action@v6
        with:
          version: v2.12.2
      - name: Generar y verificar sqlc (sin diff)
        run: sqlc generate && git diff --exit-code
      - name: Lint
        run: golangci-lint run ./...
      - name: Test (race)
        run: go test -race ./...
      - name: Build
        run: go build ./...
      - name: Migración up/down (PostgreSQL real)
        run: |
          go run ./apps/api migrate up
          go run ./apps/api migrate down 1
          go run ./apps/api migrate up

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
      - name: Contrato + cliente generado (sin diff)
        run: npm run generate:client && git diff --exit-code
      - name: Lint
        run: npm run lint
      - name: Test
        run: npm run test
      - name: Build
        run: npm run build
