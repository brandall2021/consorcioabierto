# ConsorcioAbierto — nginx para la SPA React
# Sirve estáticos y proxea /api/ hacia el API Go.
# API_UPSTREAM se setea en Dokploy (default http://consorcioabierto-api-gf3qkl:8080).
# Se usa resolver + set para que nginx arranque aunque el backend aún no exista:
# el hostname se resuelve en runtime solo cuando llega una request a /api/.
resolver 127.0.0.11 valid=10s;

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript image/svg+xml;

    # SPA fallback
    location / {
        try_files $uri $uri/ /index.html;
    }

    # API backend (se resuelve en runtime; tolera backend no levantado todavía)
    location /api/ {
        set $backend_upstream $API_UPSTREAM;
        proxy_pass $backend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
